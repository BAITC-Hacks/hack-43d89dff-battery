<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Real business challenges. Student-led solutions. Discover a clear brief, build your proposal, and turn your skills into impact with Sana.">
  <title>Sana — Real tasks. Real impact.</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="api.js" defer></script>
  <script src="examples.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="workspace.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a href="#catalog" class="wordmark" aria-label="Sana home"><span class="brand-symbol" aria-hidden="true">✳</span>sana<span class="brand-period">.</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#catalog" data-nav="catalog">Explore tasks<span class="nav-index">01</span></a>
      <a href="#how-it-works" data-nav="how-it-works">How it works<span class="nav-index">02</span></a>
      <a href="#proposals" data-nav="workspace" id="workspace-link">My proposals<span class="nav-index">03</span></a>
    </nav>
    <div class="header-actions">
      <span class="account-role" id="account-role" hidden></span>
      <button type="button" class="btn account-button" id="account-button">Sign in</button>
      <a href="#create" class="btn btn-primary header-cta">Post a task <span aria-hidden="true">↗</span></a>
      <button type="button" id="mobile-menu" class="icon-btn mobile-menu" aria-label="Open navigation" aria-expanded="false"><span aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main id="main-content" tabindex="-1"><div id="app-root"><div class="loading-state" role="status">Loading the opportunity index…</div></div></main>
  <footer class="site-footer">
    <a href="#catalog" class="footer-brand" aria-label="Sana home">sana.</a>
    <p>Business challenges.<br>Student potential. Shared progress.</p>
    <div class="footer-end"><span class="eyebrow">BUILT FOR WHAT COMES NEXT</span><span>AI Sana · Kazakhstan</span></div>
  </footer>
  <dialog id="app-dialog" aria-labelledby="dialog-title"><div class="modal-header"><p id="dialog-title" class="panel-title"></p><button class="icon-btn" id="close-dialog" aria-label="Close dialog" type="button">×</button></div><div class="modal-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="empty-state">Enable JavaScript to browse tasks and use your workspace.</p></noscript>
</body>
</html>
